# GLFM configuration
# Default values — can be overridden by environment variables (GLFM_*).
#
# config_version tracks the structure of DEFAULT_CONFIG in config.py.
# Bump it when the structure changes (not on every package release).

config_version = 2

[sources.iso_639_3]
url = "https://iso639-3.sil.org/sites/iso639-3/files/downloads/iso-639-3.tab"

[sources.iso_639_3_names]
url = "https://iso639-3.sil.org/sites/iso639-3/files/downloads/iso-639-3_Name_Index.tab"

[sources.iso_639_3_macrolanguages]
url = "https://iso639-3.sil.org/sites/iso639-3/files/downloads/iso-639-3-macrolanguages.tab"

[sources.iso_639_5]
url = "https://id.loc.gov/vocabulary/iso639-5.skos.rdf"

[sources.cldr]
version = "48.0.0"
url = "https://raw.githubusercontent.com/unicode-org/cldr-json/48.0.0/cldr-json/cldr-core/supplemental/likelySubtags.json"

[sources.wikidata]
endpoint = "https://query.wikidata.org/sparql"

[sources.wiktextract]
# Raw Wiktextract dump for POS statistics (~5-10 GB)
# Used by: python3 -m glfm.tools.download_wiktextract
#          python3 -m glfm.tools.compute_pos_stats
url = "https://dumps.wikimedia.org/other/wiktextract/20260101/wiktextract-data.jsonl.gz"
filename = "raw-wiktextract-data.jsonl.gz"
timeout = 3600

[download.consumer]
# Consumer data: 6554 languages, top-20 neighbors
url = "https://codeberg.org/lahtis/GLFM/releases/download/v.1.0.7/languages_top20.json.gz"
sha256 = ""
size_kt = 558
timeout = 300

[download.consumer.mirrors]
github = "https://github.com/lahtis/GLFM/releases/download/v.1.0.7/languages_top20.json.gz"

[download.research]
# Research data: 7928 languages, up to 100 neighbors
url = "https://codeberg.org/lahtis/GLFM/releases/download/v.1.0.7/unified_languages.json.gz"
sha256 = ""
size_mb = 1.4
timeout = 300

[download.research.mirrors]
github = "https://github.com/lahtis/GLFM/releases/download/v.1.0.7/unified_languages.json.gz"

[nearest]
# Distance computation settings
# Used by: python3 -m glfm.tools.compute_nearest_languages
distance_type = "syntax_knn"
max_neighbors = 100
decimals = [4, 6]
checkpoint_interval = 1000

[http]
user_agent = "glfm/1.0.7 (https://codeberg.org/lahtis/GLFM)"
timeout = 60

[paths]
cache_dir = ""
data_dir = ""
cache_dir_name = "glfm"
data_subdir = "data"

[logging]
level = "INFO"
