[build-system]
requires = ["setuptools>=70.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glfm"
dynamic = ["version"]
description = "A comprehensive JSON database of 7,900+ languages (ISO 639-3) with nearest-language data, BCP-47 tags, fallback chains, and optional POS statistics for RSS, localization, and NLP workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Tuomas Lähteenmäki" }
]
keywords = [
    "python", "linux", "localization", "iso639-3", "bcp47",
    "language-mapping", "nlp", "glottolog", "uriel", "lang2vec",
    "pos-stats", "wiktextract"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Internationalization",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "numpy>=1.26.0",
    "requests>=2.28.0",
    "msgpack>=1.0.5",
    "graphviz>=0.20",
    "lang2vec>=1.1.0",
]

[project.urls]
Homepage = "https://codeberg.org/lahtis/GLFM"
Repository = "https://codeberg.org/lahtis/GLFM"

# --- Version read from _version.py ---
[tool.setuptools.dynamic]
version = { attr = "glfm._version.__version__" }

# --- Packages from src/ ---
[tool.setuptools.packages.find]
where = ["src"]
include = ["glfm*"]
exclude = ["tests*"]

# --- Internal data (override_scripts, uralic_languages) ---
[tool.setuptools.package-data]
glfm = ["data/*.json"]
